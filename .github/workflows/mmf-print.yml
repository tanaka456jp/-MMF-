name: MMF VBA Calculation and Print Contracts
on:
  push:
    paths:
      - 'source/standard/ModuleMMFPrint.bas'
      - 'source/standard/ModuleMMFInput.bas'
      - 'source/standard/ModuleMMFCalc.bas'
      - 'source/document/ThisWorkbook.cls'
      - 'project.json'
      - 'target/**'
      - 'tests/**'
      - '.github/workflows/mmf-print.yml'
  pull_request:
    paths:
      - 'source/standard/ModuleMMFPrint.bas'
      - 'source/standard/ModuleMMFInput.bas'
      - 'source/standard/ModuleMMFCalc.bas'
      - 'source/document/ThisWorkbook.cls'
      - 'project.json'
      - 'target/**'
      - 'tests/**'
      - '.github/workflows/mmf-print.yml'
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workbook headers and VBAUpdater mapping
        run: python -m unittest discover -s tests -p 'test_mmf_*.py' -v
